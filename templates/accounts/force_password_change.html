{% extends 'base.html' %} {% block content %}
<div
  class="max-w-md mx-auto bg-white p-6 rounded-lg shadow-sm border border-slate-200 mt-10"
>
  <h1 class="text-xl font-bold text-amber-800 mb-2">
    Change Temporary Password
  </h1>
  <p class="text-xs text-slate-600 mb-4">
    You must set a new personal password (minimum 8 characters) before accessing
    the system (FR-A2).
  </p>
  <form method="post" class="space-y-4">
    {% csrf_token %}
    <div>
      <label class="block text-sm font-medium mb-1">New Password</label>
      <input
        type="password"
        name="new_password"
        required
        minlength="8"
        class="w-full border rounded px-3 py-2 text-sm"
      />
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Confirm New Password</label>
      <input
        type="password"
        name="confirm_password"
        required
        minlength="8"
        class="w-full border rounded px-3 py-2 text-sm"
      />
    </div>
    <button
      type="submit"
      class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-semibold py-2 rounded"
    >
      Save New Password
    </button>
  </form>
</div>
{% endblock %}
