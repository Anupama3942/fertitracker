{% extends 'base.html' %} {% block content %}
<div
  class="max-w-md mx-auto bg-white p-6 rounded-lg shadow-sm border border-slate-200 mt-10"
>
  <h1 class="text-xl font-bold text-slate-800 mb-4">Set New Password</h1>

  <form method="post" class="space-y-4">
    {% csrf_token %} {% if simulated_otp %}
    <div
      class="p-3 bg-amber-50 border border-amber-200 rounded text-xs text-amber-800"
    >
      <strong>[Simulated SMS]:</strong> Your Reset OTP is
      <span class="font-mono font-bold text-base">{{ simulated_otp }}</span>.
    </div>
    {% endif %}
    <div>
      <label class="block text-sm font-medium mb-1">Enter OTP</label>
      <input
        type="text"
        name="otp"
        required
        maxlength="6"
        class="w-full border rounded px-3 py-2 font-mono text-center text-lg"
      />
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">New Password</label>
      <input
        type="password"
        name="new_password"
        required
        class="w-full border rounded px-3 py-2 text-sm"
      />
    </div>
    <button
      type="submit"
      class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-semibold py-2 rounded"
    >
      Update Password
    </button>
  </form>
</div>
{% endblock %}
