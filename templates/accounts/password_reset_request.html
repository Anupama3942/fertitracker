{% extends 'base.html' %} {% block content %}
<div
  class="max-w-md mx-auto bg-white p-6 rounded-lg shadow-sm border border-slate-200 mt-10"
>
  <h1 class="text-xl font-bold text-slate-800 mb-2">Password Reset</h1>
  <p class="text-xs text-slate-500 mb-4">
    Enter your registered NIC number to receive a verification OTP.
  </p>

  <form method="post" class="space-y-4">
    {% csrf_token %}
    <div>
      <label class="block text-sm font-medium mb-1">NIC Number</label>
      <input
        type="text"
        name="nic"
        required
        class="w-full border rounded px-3 py-2 text-sm"
      />
    </div>
    <button
      type="submit"
      class="w-full bg-slate-700 hover:bg-slate-800 text-white font-semibold py-2 rounded"
    >
      Request Reset OTP
    </button>
  </form>
  <div class="mt-4 text-center text-xs">
    <a href="{% url 'login' %}" class="text-emerald-700 hover:underline"
      >Back to Login</a
    >
  </div>
</div>
{% endblock %}
